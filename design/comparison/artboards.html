<style>
@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-400.woff2')}@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-600.woff2');font-weight:600}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-normal-400.woff2')}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-italic-400.woff2');font-style:italic}
*{box-sizing:border-box}body{margin:0;background:#ddd;font:18px/1.55 Manrope;color:#222}h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:600;line-height:1.12}img{display:block;width:100%;height:100%;object-fit:cover}.artboard{width:900px;height:1125px;margin-bottom:40px;position:relative;overflow:hidden;background:white;display:flex;flex-direction:column}.small{font-size:13px}.eyebrow{font-size:11px;letter-spacing:1.9px;text-transform:uppercase}.serif{font-family:Cormorant;font-weight:400}.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.study-note{margin-top:auto;padding:10px 30px;font-size:9px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid currentColor;opacity:.7}.button{display:inline-flex;align-items:center;justify-content:space-between;gap:32px;font-size:15px;font-weight:600;padding:18px 24px}.photo{position:relative;overflow:hidden}.draft{color:#333;background:#fff}.draft .study-note{color:#656565;border-color:#ddd}.draft-nav{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-bottom:1px solid #ddd;flex-shrink:0}.draft-nav strong{font-size:24px}.draft-nav span{font-size:13px;color:#666}.draft-content{padding:32px 44px}.draft h1{font-size:31px;letter-spacing:-.7px}.draft h2{font-size:23px;margin-bottom:13px}.draft h3{font-size:18px}.draft p{font-size:16px;line-height:1.7;color:#606060}.draft .intro{background:#f2f2f2;padding:25px;margin:25px 0}.draft .intro p{margin-top:13px}.draft .plain-button{display:inline-block;border:1px solid #999;background:#f6f6f6;padding:11px 25px;font-size:14px;margin-top:18px}.draft .plain-button.primary{background:#4b596a;color:white;border-color:#4b596a}.draft .breadcrumb{font-size:12px;color:#777;margin-bottom:23px}.draft .photo{height:240px}.draft .columns{display:grid;grid-template-columns:1fr 1fr;gap:26px}.draft .list{margin-top:24px;border-top:1px solid #ddd}.draft .list>div{display:flex;justify-content:space- /* Bakery: a red-and-butter shopfront, proper menu typography, and honest bread photography. */
.bakery{background:#fff3d9;color:#a42c22}.bakery .announcement{text-align:center;height:31px;background:#a42c22;color:#fff3d9;font-size:11px;line-height:31px;letter-spacing:.1em}.bakery-nav{padding:22px 36px;display:flex;justify-content:space-between;align-items:center;height:100px;border-bottom:1px solid #a42c2240}.bakery-logo{font:600 25px/.9 Manrope;letter-spacing:-1.5px}.bakery-logo span{font:italic 30px/.9 Cormorant}.bakery-nav .links{font-size:13px;word-spacing:14px}.bakery-nav .reserve{border-bottom:1px solid currentColor;font-size:13px;padding-bottom:5px}.bakery-head{padding:23px 36px 31px;display:grid;grid-template-columns:1.5fr 1fr;align-items:end;gap:25px}.bakery h1{font:400 112px/.85 Cormorant;letter-spacing:-5px}.bakery h1 em{font-weight:400}.bakery-head p{font-size:15px;max-width:255px;margin-bottom:6px}.bakery-head .eyebrow{margin-bottom:22px}.bakery-spread{display:grid;grid-template-columns:1.12fr 1fr;min-height:402px;margin:0 24px;border:1px solid #a42c22}.bakery-spread>.photo{height:402px}.bakery-spread img{object-position:45% 50%}.bread-caption{position:absolute;left:20px;bottom:20px;background:#fff3d9;padding:10px 14px;font:italic 22px Cormorant;transform:rotate(-4deg);box-shadow:0 3px 8px #0002}.counter{background:#f9db83;padding:27px 25px}.counter h2{font:40px/.95 Cormorant;letter-spacing:-1px;margin:7px 0 26px}.counter-item{padding:12px 0;border-top:1px solid #a42c2245}.counter-item .row{gap:10px;font-size:16px}.counter-item small{display:block;font-size:11px;line-height:1.6;margin-top:4px}.counter-note{font:italic 21px Cormorant;margin-top:14px}.bakery-visit{padding:30px 36px 25px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}.bakery-visit h2{font:37px/.95 Cormorant;letter-spacing:-.8px}.bakery-visit p{font-size:12px;margin-top:12px;max-width:330px}.bakery .button{background:#a42c22;color:#fff3d9;width:100%;padding:17px 21px}.bakery-visit .hours{font-size:11px;margin-top:12px;display:flex;justify-content:space-between}.bakery .study-note{margin-inline:24px;padding-inline:12px}
/* Cycling: assertive lime typography, the actual frame in focus, and one useful next step. */
.cycling{color:#e8ff74;background:#182a2e}.cycle-nav{height:84px;padding:0 34px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8ff7440}.cycle-logo{font-size:24px;font-weight:600;font-style:italic;letter-spacing:-1.4px}.cycle-nav .links{font-size:12px;word-spacing:18px;color:#f0f2e9}.cycle-nav .bag{font-size:12px;border:1px solid #e8ff7460;padding:8px 15px;border-radius:100px}.cycle-head{padding:28px 34px 19px}.cycle-head .eyebrow{color:#dae0d5;display:flex;justify-content:space-between}.cycling h1{font-size:116px;line-height:.9;letter-spacing:-8px;font-weight:600;margin-top:24px}.cycling h1 .second{margin-left:60px;font-style:italic}.cycling .ride-photo{height:371px;margin:0 18px;background:#23363b}.ride-photo img{object-position:50% 85%}.ride-photo .ride-tag{position:absolute;top:18px;right:19px;background:#e8ff74;color:#182a2e;font:600 12px/1.5 Manrope;padding:12px 18px;transform:rotate(5deg)}.ride-photo .photo-id{position:absolute;left:18px;bottom:16px;color:#fff;font-size:10px;letter-spacing:2px}.cycle-product{padding:25px 34px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}.cycle-product h2{font-size:27px;letter-spacing:-1px;color:#fff}.cycle-product p{color:#c7d2cc;font-size:12px;line-height:1.7;margin-top:8px;max-width:395px}.cycle-product .button{background:#e8ff74;color:#182a2e;width:100%;padding:17px 20px}.cycle-product .stock{font-size:11px;color:#d2dccd;margin-top:9px}.ride-footer{background:#c9c4ee;color:#182a2e;margin:0 18px;padding:24px 24px;display:grid;grid-template-columns:1fr 2fr auto;gap:20px;align-items:center}.ride-footer .day{font:600 37px/.9 Manrope;letter-spacing:-1.5px}.ride-footer h3{font-size:19px;letter-spacing:-.4px}.ride-footer p{font-size:12px;margin-top:6px}.ride-footer .arrow{border:1px solid #182a2e;width:45px;height:45px;display:grid;place-items:center;border-radius:50%;font-size:24px}.cycling .study-note{color:#d8e0ce;margin-inline:18px;padding-inline:16px;border-color:#d8e0ce30}
/* Hospitality: editorial space, olive and tobacco, an uncluttered booking strip. */
.stay{background:#f0eee5;color:#3b4736}.stay-nav{padding:25px 34px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3b47362e;height:92px}.stay-logo{font:32px/.8 Cormorant;letter-spacing:-1px}.stay-logo span{display:block;font:9px Manrope;letter-spacing:3px;margin-top:7px}.stay-nav .links{font-size:12px;word-spacing:17px}.stay-nav .small{border-bottom:1px solid #3b4736;padding-bottom:5px}.stay-heading{padding:29px 34px 28px;display:grid;grid-template-columns:1.8fr 1fr;gap:20px;align-items:end}.stay h1{font:400 92px/.94 Cormorant;letter-spacing:-4px}.stay h1 em{font-weight:400}.stay-heading p{font-size:13px;line-height:1.8;max-width:230px;margin-bottom:8px}.stay-image{margin:0 18px;height:450px}.stay-image img{object-position:50% 54%}.stay-image .caption{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;color:#fff;text-shadow:0 1px 8px #0009}.stay-image .caption b{font:38px Cormorant}.stay-image .caption span{font-size:10px;letter-spacing:1.5px}.stay-image::after{content:'';position:absolute;inset:65% 0 0;background:linear-gradient(transparent,#0008);pointer-events:none}.stay-image .caption{z-index:1}.booking{margin:0 18px;background:#3b4736;color:#f0eee5;display:grid;grid-template-columns:1fr 1fr 1.3fr;align-items:center;padding:20px 22px;gap:20px}.booking small{font-size:9px;letter-spacing:1.2px;display:block;margin-bottom:7px}.booking b{font-size:15px;font-weight:400}.booking .button{background:#e8c7a8;color:#332d25;padding:16px 20px;white-space:nowrap;font-size:13px}.stay-bottom{padding:26px 34px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px}.stay-bottom h2{font:36px/.95 Cormorant;letter-spacing:-1px}.stay-bottom p{font-size:12px;margin-top:12px;line-height:1.7;max-width:370px}.stay-facts{display:flex;justify-content:space-between;gap:18px;padding-top:5px}.stay-facts strong{font:42px/1 Cormorant;display:block}.stay-facts span{font-size:11px;display:block;margin-top:8px}.stay .study-note{margin-inline:18px;padding-inline:16px}
[data-artboard="stay-before"] .photo{height:210px}[data-artboard="stay-before"] .list>div{padding:9px 0}[data-artboard="stay-before"] .draft-content{padding-top:26px;padding-bottom:26px}
</style></head><body><div id="boards"></div>
<script>
const host=document.getElementById('boards');
const image=(file,cls='',more='')=>`<div class="photo ${cls}"><img src="/design/playground/photos/${file}.jpg" alt="">${more}</div>`;
const note=name=>`<footer class="study-note"><span>ORIGINAL DESIGN STUDY · FICTIONAL BUSINESS & SAMPLE DETAILS</span><span>${name} / B.S</span></footer>`;
const draftNav=(brand,links)=>`<nav class="draft-nav"><strong>${brand}</strong><span>${links}</span></nav>`;
const button=(text,cls='')=>`<span class="plain-button ${cls}">${text}</span>`;
function board(id,version,cls,content){host.insertAdjacentHTML('beforeend',`<article class="artboard ${cls}" data-artboard="${id}-${version}">${content}${note(id.toUpperCase())}</article>`)}
board('bakery','before','draft',draftNav('Butter & Crumb','Home &nbsp; About Us &nbsp; Products &nbsp; Contact')+`<main class="draft-content"><p class="breadcrumb">Home / Welcome to Butter & Crumb</p><h1>Welcome to our bakery</h1><div class="intro"><p>We bake bread and serve coffee. Visit Butter & Crumb for sourdough, focaccia, cinnamon buns and filter coffee.</p></div><div class="columns">${image('bread')}<div><h2>Fresh bread, every morning</h2><p>Our first batch is ready at 7 am. You can reserve a loaf for collection or come into the shop.</p>${button('Learn more')}</div></div><h2 class="heading-gap">Our products</h2><div class="list"><div><span>House sourdough / 800 g</span><span>₹280</span></div><div><span>Rosemary focaccia / a generous slice</span><span>₹160</span></div><div><span>Cinnamon bun / soft middle, sticky edges</span><span>₹140</span></div><div><span>Filter coffee / hot or over ice</span><span>₹120</span></div></div><div class="columns heading-gap"><div><h3>Opening hours</h3><p style="margin-top:10px">Tuesday–Sunday, 7 am–3 pm.<br>Closed Mondays.<br>12 Market Lane, Bengaluru.</p></div><div><h3>Contact and orders</h3><p style="margin-top:10px">Want us to put something aside?<br>Contact us to reserve a loaf.</p>${button('Contact us','primary')}</div></div></main>`);
board('bakery','after','bakery',`<div class="announcement">THE FIRST BATCH IS OUT AT 7. &nbsp; TUESDAY — SUNDAY.</div><nav class="bakery-nav"><div class="bakery-logo">BUTTER<br><span>& Crumb</span></div><span class="links">The counter &nbsp; Our kitchen</span><span class="reserve">Save me a loaf ↗</span></nav><header class="bakery-head"><div><p class="eyebrow">12 Market Lane · Bengaluru</p><h1>Still warm.<br><em>Come on in.</em></h1></div><p>Crackly crusts. Coffee on.<br>A few crumbs on the table.<br>Just how a morning should start.</p></header><section class="bakery-spread">${image('bread','',`<span class="bread-caption">Yes, we saved you the end piece.</span>`)}<div class="counter"><span class="eyebrow">Baked here. Every morning.</span><h2>On the counter</h2>${[['House sourdough','₹280','800 g · a good loaf for the whole week'],['Rosemary focaccia','₹160','A generous slice. Best eaten warm.'],['Cinnamon bun','₹140','Soft middle. Sticky edges.'],['Filter coffee','₹120','Hot, or over ice. Your call.']].map(([n,p,d])=>`<div class="counter-item"><div class="row"><b>${n}</b><b>${p}</b></div><small>${d}</small></div>`).join('')}<p class="counter-note">A little butter makes it better.</p></div></section><section class="bakery-visit"><div><h2>Your corner table<br>is waiting.</h2><p>12 Market Lane, Bengaluru.<br>Bring a book. Bring a friend. We’ll put the kettle on.</p></div><div><span class="button">Save me a loaf <span>↗</span></span><div class="hours"><span>Tue—Sun · 7 am—3 pm</span><span>Mondays, we rest.</span></div></div></section>`);
board('cycling','before','draft',draftNav('Longway Cycles','Home &nbsp; Bicycles &nbsp; Services &nbsp; Contact')+`<main class="draft-content"><p class="breadcrumb">Home / Bicycles / Road / Everyday Road</p><h1>Everyday Road Bicycle</h1><p style="margin-top:12px">Product code: LW-01 &nbsp; | &nbsp; Category: Road bicycles</p><div class="columns" style="margin-top:27px">${image('bicycle')}<div><h2>₹28,500</h2><p>Steel road bicycle. Available in 52 cm and 56 cm frame sizes. Choose your size below.</p><label style="margin-top:20px">Frame size<div class="field">Please select ▾</div></label>${button('Submit enquiry','primary')}</div></div><h2 class="heading-gap">Product information</h2><p>A steel frame for weekday commutes and longer weekend rides. Drop handlebars, everyday gearing, and a comfortable riding position. Visit the shop for a test ride.</p><div class="details"><span>Frame material</span><span>Steel</span><span>Available sizes</span><span>52 cm / 56 cm</span><span>Test rides</span><span>Available at the shop</span><span>Starting price</span><span>₹28,500</span></div><div class="intro"><h3>Sunday group ride</h3><p>Meet at the shop at 6:30 am. 38 km. We wait at every turn. All riders welcome.</p>${button('More information')}</div><p class="small">Not sure which frame size? Ask us before ordering.</p></main>`);
board('cycling','after','cycling',`<nav class="cycle-nav"><strong class="cycle-logo">LONGWAY /</strong><span class="links">Bikes &nbsp; Workshop &nbsp; Ride with us</span><span class="bag">THE SHOP ↗</span></nav><header class="cycle-head"><div class="eyebrow"><span>For the commute. And the detour.</span><span>01 / EVERYDAY ROAD</span></div><h1>TAKE THE<br><span class="second">LONG WAY.</span></h1></header>${image('bicycle','ride-photo',`<span class="ride-tag">STEEL IS REAL.<br>COME FEEL THE DIFFERENCE.</span><span class="photo-id">THE EVERYDAY ROAD &nbsp; / &nbsp; 52 & 56 CM</span>`)}<section class="cycle-product"><div><h2>Monday commute.<br>Sunday escape.</h2><p>A steel frame, drop bars, and no reason to rush home.<br>From ₹28,500 · 52 / 56 cm</p></div><div><span class="button">Find your fit <span>↗</span></span><p class="stock">Try it at the shop. We’ll set it up for you.</p></div></section><aside class="ride-footer"><div class="day">SUN<br>06:30</div><div><h3>Nobody gets left at the lights.</h3><p>38 km. Meet at the shop. We wait at every turn.</p></div><span class="arrow">↗</span></aside>`);
board('stay','before','draft',draftNav('Field House','Home &nbsp; Rooms &nbsp; Facilities &nbsp; Booking')+`<main class="draft-content"><p class="breadcrumb">Home / Accommodation / The Courtyard House</p><h1>The Courtyard House</h1><p style="margin-top:12px">A two-bedroom house for up to four guests.</p><div class="columns" style="margin-top:25px">${image('interior')}<div><h2>About the property</h2><p>Spend a quiet weekend in a light-filled house. The property includes a courtyard, kitchen, dining space and two bedrooms.</p><p style="margin-top:12px">From ₹8,400 per night.<br>Two-night minimum stay.</p></div></div><h2 class="heading-gap">Facilities</h2><div class="list"><div><span>Bedrooms</span><span>2</span></div><div><span>Maximum guests</span><span>4</span></div><div><span>Kitchen</span><span>Available</span></div><div><span>Outdoor space</span><span>Private courtyard</span></div></div><h2 class="heading-gap">Booking enquiry</h2><div class="fields"><label>Arrival date<div class="field">Select date</div></label><label>Departure date<div class="field">Select date</div></label><label>Number of guests<div class="field">Select guests</div></label><label>Room type<div class="field">The Courtyard House</div></label></div>${button('Submit enquiry','primary')}<p class="small" style="margin-top:14px">Check availability for your chosen dates.</p></main>`);
board('stay','after','stay',`<nav class="stay-nav"><div class="stay-logo">Field House<span>A PLACE TO STAY</span></div><span class="links">The house &nbsp; Around here</span><span class="small">Plan your stay ↗</span></nav><header class="stay-heading"><h1>Leave the<br><em>weekend open.</em></h1><p>No itinerary required.<br>A long breakfast, a book<br>you might finish, and<br>a house all to yourself.</p></header>${image('interior','stay-image',`<div class="caption"><b>The Courtyard House</b><span>01 / THE LIVING ROOM</span></div>`)}<section class="booking"><div><small>ARRIVE</small><b>Pick a Friday &nbsp;⌄</b></div><div><small>LEAVE</small><b>Stay a little longer &nbsp;⌄</b></div><span class="button">Find a weekend <span>↗</span></span></section><section class="stay-bottom"><div><span class="eyebrow">Make yourself at home</span><h2 style="margin-top:14px">Space for four.<br>Room to exhale.</h2><p>A private courtyard, a kitchen for slow mornings,<br>and enough space to leave your shoes by the door.</p></div><div><div class="stay-facts"><div><strong>02</strong><span>Bedrooms</span></div><div><strong>04</strong><span>Guests</span></div><div><strong>₹8,400</strong><span>From / night</span></div></div><p style="border-top:1px solid #3b473630;padding-top:17px;margin-top:20px">Two nights at least.<br>One less thing to hurry.</p></div></section>`);
</script></body></html>
