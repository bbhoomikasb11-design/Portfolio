*{box-sizing:border-box}body{margin:0;font:400 18px/1.6 Manrope;color:#18202c;background:#e9edf4}h1,h2,h3,p{margin:0}h1{font-size:42px;letter-spacing:-1.8px;line-height:1.16;font-weight:600}h2{font-size:26px;letter-spacing:-.6px;line-height:1.3;font-weight:600}h3{font-size:19px;font-weight:600}small{font-size:14px}b{font-weight:600}em{font-family:Cormorant;font-weight:400;color:#155eef}.artboard{width:720px;height:900px;background:#f8f9fc;position:relative;overflow:hidden;margin-bottom:30px;padding:34px 42px}.artboard>nav{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid #dce1e9;font-size:14px}.brand{font-size:24px;font-weight:600;letter-spacing:-1px}.avatar{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#dce5f4;color:#254878;font-size:11px;margin-left:16px}.muted{color:#596375}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#596375}.crumb{font-size:13px;color:#596375;margin:27px 0 19px}.line{height:1px;background:#dce1e9;margin:22px 0}.row{display:flex;align-items:center;gap:16px}.between{justify-content:space-between}.btn{display:block;padding:17px 22px;border-radius:9px;background:#155eef;color:white;font-size:17px;font-weight:600;text-align:center}.btn.outline{background:transparent;color:#253343;border:1px solid #9aa5b7;border-radius:3px;padding:12px 20px}.tag{background:#e7eefb;color:#244b90;border-radius:5px;font-size:12px;display:inline-block;padding:5px 11px}.field{border:1px solid #bac3d0;background:white;border-radius:7px;padding:12px 16px;font-size:16px;margin:7px 0 18px;min-height:49px;color:#596375}.after .field{border-color:#d4dae5;background:#fff}.footnote{position:absolute;bottom:20px;left:42px;right:42px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#596375}.before h1{font-size:30px;letter-spacing:-.8px}.before{background:#fff}.before .brand{font-size:19px;letter-spacing:-.4px}.before nav{font-size:12px}.before .field{border-radius:2px}.before .eyebrow{letter-spacing:.5px}
.lamp-scene{height:242px;background:#dce5f4;position:relative;overflow:hidden;border-radius:10px}.lamp-scene::after{content:'';position:absolute;bottom:30px;left:calc(50% - 110px);width:220px;height:20px;border-radius:50%;background:#6d83a433;filter:blur(5px)}.lamp{position:absolute;top:28px;left:calc(50% - 60px);width:120px;height:185px}.lamp .shade{position:absolute;left:0;top:0;width:120px;height:64px;background:#284c7f;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}.lamp .shade::after{content:'';position:absolute;left:9px;right:9px;bottom:1px;height:5px;background:#c4d4e9;border-radius:50%}.lamp .stem{position:absolute;width:8px;height:103px;background:#25416a;left:56px;top:60px}.lamp .base{position:absolute;bottom:13px;left:10px;width:100px;height:16px;border-radius:50%;background:#284c7f}.lamp .cord{position:absolute;bottom:12px;left:85px;width:75px;height:34px;border:2px solid #425675;border-top:0;border-left:0;border-radius:0 0 40px 0}.lamp-scene .scene-note{position:absolute;bottom:13px;left:17px;font-size:10px;letter-spacing:1px;color:#435672}.before .lamp-scene{height:190px;margin-bottom:22px;border-radius:0;background:#edf0f5}.before .lamp{transform:scale(.76);transform-origin:top;top:16px}.before .lamp-scene::after{bottom:25px}.market-details{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:23px 0}.market-details small{display:block}.seller{padding:14px 0;display:flex;gap:12px;align-items:center;font-size:14px}.seller .avatar{margin:0;width:39px;height:39px}.price{font-size:38px;letter-spacing:-1.4px;font-weight:600}.before .table{margin:23px 0;display:grid;grid-template-columns:125px 1fr;gap:12px;font-size:16px}
.daystrip{display:flex;gap:8px;margin:26px 0}.daystrip>div{flex:1;text-align:center;padding:12px 0;border-radius:9px;font-size:12px;color:#596375}.daystrip b{display:block;font-size:23px;color:#18202c}.daystrip .active{background:#155eef;color:#fff}.daystrip .active b{color:#fff}.focus-card{padding:26px;background:#e6edfa;border:1px solid #d1ddf4;border-radius:14px}.focus-card .eyebrow{color:#335689}.focus-card h2{font-size:33px;margin:12px 0}.focus-card p{font-size:16px;color:#43546e}.task{display:flex;gap:16px;padding:22px 0;border-bottom:1px solid #dce1e9;align-items:center}.check{width:22px;height:22px;border:1.5px solid #9ba9bc;border-radius:6px;flex-shrink:0}.task small{display:block;margin-top:4px;color:#596375}.time{margin-left:auto;font-size:13px;color:#596375}.table-row{display:grid;grid-template-columns:1.65fr 1fr 1fr;gap:15px;padding:20px 12px;border-bottom:1px solid #ddd;font-size:15px}.table-row.head{background:#f0f1f3;font-size:12px}.before .count-row{display:flex;gap:20px;padding:25px 0;font-size:15px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);font-size:14px;text-align:center;gap:16px;margin-top:20px}.calendar b{background:#eee}
.event-poster{background:#dce5f4;display:flex;justify-content:space-between;padding:25px 28px;border-radius:12px;margin:28px 0 25px;height:185px}.event-poster h2{font:46px/1 Cormorant;letter-spacing:-1.4px;margin-top:9px}.books{position:relative;display:flex;align-items:end;gap:5px;width:157px;padding-bottom:5px}.books i{height:112px;width:40px;background:#294c80;border-radius:3px 6px 6px 3px;border-left:4px solid #193a68;position:relative}.books i::after{content:'';position:absolute;left:5px;right:5px;top:16px;height:1px;background:#ffffff70;box-shadow:0 5px #ffffff70}.books i:nth-child(2){height:125px;background:#f8f9fc;border-color:#bbcbe2;transform:rotate(9deg);margin-left:8px}.books i:nth-child(3){height:96px;background:#6682ad;border-color:#4a6895}.event-facts{display:flex;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid #dce1e9;margin-bottom:25px;font-size:14px}.event-facts b{display:block;color:#18202c;margin-bottom:3px}.event-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0 6px}.event-fields label{font-size:14px}.before .event-fields{margin-top:20px;gap:12px 18px}.before .field{margin-bottom:8px}.before .event-poster{height:125px;margin-top:24px;border-radius:0;background:#edf0f5}.before .event-poster h2{font:600 27px/1.3 Manrope;letter-spacing:-.5px}.before .books{transform:scale(.6);transform-origin:right center}

[data-artboard="planner-after"] h1{font-size:38px}
[data-artboard="planner-after"] .daystrip{margin:18px 0}

</style><body><div id="boards"></div><script>
const host=document.getElementById('boards');
const nav=(brand,links)=>`<nav><span class="brand">${brand}</span><span>${links}</span></nav>`;
const foot=(name)=>`<div class="footnote"><span>ORIGINAL INTERFACE STUDY · SAMPLE CONTENT</span><span>${name}</span></div>`;
const lamp=`<div class="lamp-scene"><div class="lamp"><i class="shade"></i><i class="stem"></i><i class="base"></i><i class="cord"></i></div><span class="scene-note">DESK LAMP / ILLUSTRATION</span></div>`;
const books=`<div class="books"><i></i><i></i><i></i></div>`;
function board(id,version,html){host.insertAdjacentHTML('beforeend',`<article data-artboard="${id}-${version}" class="artboard ${version}">${html}${foot(id.toUpperCase())}</article>`)}
board('market','before',nav('Second desk','Home &nbsp; Buy &nbsp; Sell &nbsp; Account')+`<p class="crumb">Home / Items / Furniture / Lamp</p><h1>Desk lamp for sale</h1><p class="muted" style="margin:12px 0 20px;font-size:15px">Item ID: SD-028 · Category: Furniture</p>${lamp}<h2>₹850</h2><div class="table"><span>Condition</span><span>Used, good condition</span><span>Location</span><span>Near campus</span><span>Posted by</span><span>Ananya</span></div><p style="font-size:16px">Blue desk lamp. Works well. Bulb included. Small mark on the base. Selling because I’m moving.</p><div class="line"></div><div class="row"><span class="btn outline" style="flex:1">Contact</span><span class="btn outline">Save item</span></div>`);
board('market','after',nav('Second desk','Find something &nbsp; <span class="avatar">A</span>')+`<p class="crumb">← Back to campus finds</p>${lamp}<div class="row between" style="margin-top:24px"><span class="tag">Pre-loved · Works well</span><span style="font-size:24px">♡</span></div><div class="row between" style="margin-top:13px;align-items:start"><h1>Blue desk lamp</h1><span class="price">₹850</span></div><p class="muted" style="font-size:16px;margin-top:13px">Blue desk lamp. Bulb included, one small mark on the base. Ready for someone else’s desk.</p><div class="market-details"><div><small class="muted">PICKUP</small><b>Near campus</b></div><div><small class="muted">GOOD TO KNOW</small><b>Check it before you pay</b></div></div><div class="btn">Ask Ananya about pickup ↗</div><div class="seller"><span class="avatar">A</span><span><b>Ananya</b><br><small class="muted">“Moving out. The lamp still has plenty left in it.”</small></span></div>`);
board('planner','before',nav('Study Planner','Dashboard &nbsp; Tasks &nbsp; Calendar')+`<p class="crumb">Dashboard</p><h1>Your tasks</h1><div class="count-row"><span>Total: 5</span><span>Pending: 3</span><span>Completed: 2</span></div><div class="row between" style="margin-bottom:20px"><span class="btn outline">Add task</span><span class="muted" style="font-size:14px">Filter: All tasks ▾</span></div><div class="table-row head"><span>TASK NAME</span><span>DUE DATE</span><span>STATUS</span></div>${[['Revise SQL joins','Today','Pending'],['Read chapter 4','Tomorrow','Pending'],['Finish wireframes','Today','Pending'],['Submit lab record','Yesterday','Completed'],['Review notes','Yesterday','Completed']].map(t=>`<div class="table-row">${t.map(v=>`<span>${v}</span>`).join('')}</div>`).join('')}<h2 style="margin-top:32px;font-size:22px">Calendar</h2><div class="calendar">${['M','T','W','T','F','S','S',12,13,14,15,16,17,18].map(t=>`<span>${t}</span>`).join('')}</div>`);
board('planner','after',nav('one thing.','Your week <span class="avatar">B</span>')+`<p class="eyebrow" style="margin-top:33px">WEDNESDAY, 14 OCTOBER · SAMPLE WEEK</p><h1 style="margin-top:12px">Today, one thing<br>at a time.</h1><div class="daystrip">${['Mon','Tue','Wed','Thu','Fri'].map((d,i)=>`<div class="${i===2?'active':''}">${d}<b>${12+i}</b></div>`).join('')}</div><div class="focus-card"><div class="row between"><span class="eyebrow">START HERE</span><span class="tag">Due today</span></div><h2>Revise SQL joins</h2><p>One topic, 25 minutes. Leave the rest for later.</p><div class="btn" style="margin-top:23px">Start a focus session →</div></div><div class="row between" style="margin-top:30px"><h3>After that</h3><span class="muted" style="font-size:13px">2 things left</span></div><div class="task"><span class="check"></span><div><b>Finish wireframes</b><small>Design project · Due today</small></div><span class="time">45 min</span></div><div class="task"><span class="check"></span><div><b>Read chapter 4</b><small>Tomorrow is fine</small></div><span class="time">20 min</span></div><p class="muted" style="font-size:13px;margin-top:20px">✓ Two things done already. That counts.</p>`);
board('event','before',nav('Campus Events','Events &nbsp; Register &nbsp; My account')+`<div class="event-poster"><div><small>UPCOMING EVENT</small><h2>The Sunday<br>book swap</h2></div>${books}</div><p style="font-size:15px">Sunday · 10:30–12:00 · College courtyard · Free</p><h1 style="margin-top:24px">Event registration</h1><p class="muted" style="font-size:14px;margin-top:8px">Fill out the form below to register for the event.</p><div class="event-fields">${['First name *','Last name *','Email address *','Phone number *','College *','Year of study *'].map(t=>`<label>${t}<div class="field">Enter ${t.toLowerCase().replace(' *','')}</div></label>`).join('')}</div><label style="font-size:14px">Additional information<div class="field" style="height:75px">Your message</div></label><p style="font-size:13px;margin:19px 0">□ I agree to the terms and conditions.</p><div class="btn outline">Submit</div>`);
board('event','after',nav('around campus','A good reason to step out ↗')+`<div class="event-poster"><div><span class="eyebrow">BRING A BOOK. FIND A STORY.</span><h2>The Sunday<br>book swap.</h2></div>${books}</div><div class="event-facts"><div><b>Sunday, 10:30–12:00</b><span class="muted">College courtyard</span></div><div><b>Free to join</b><span class="muted">Bring one book to swap</span></div></div><h1 style="font-size:36px">Got a book you’d pass on?</h1><p class="muted" style="font-size:17px;margin-top:15px">Bring it along. Meet a few people, leave with a new read. You don’t need to have finished it.</p><div class="event-fields" style="grid-template-columns:1fr;margin:25px 0 0;gap:0"><label>Your name<div class="field">What should we call you?</div></label><label>Email address<div class="field">For your event reminder</div></label></div><p class="muted" style="font-size:13px;margin:0 0 23px">Just the details for this event. No mailing list.</p><div class="btn">Save my place →</div><p class="muted" style="font-size:13px;text-align:center;margin-top:16px">Plans change. You can cancel from the reminder email.</p>`);
</script></body></html>
