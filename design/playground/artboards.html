<style>
@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-400.woff2')}@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-600.woff2');font-weight:600}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-normal-400.woff2')}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-italic-400.woff2');font-style:italic}

.orbit{background:#e4e9f7}.orbit .browser{margin-top:25px;transform:rotate(-2deg)}.orbit h1{font-size:62px}.tasks{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.taskcol{background:#f4f6fa;border-radius:12px;padding:13px}.task{background:white;border:1px solid #e8ebf1;border-radius:8px;padding:14px 11px;margin-top:13px;font-size:10px;min-height:85px}.faces{display:flex;margin-top:15px}.faces span{width:22px;height:22px;border-radius:50%;background:#dce5f4;border:2px solid white;display:grid;place-items:center;font-size:8px;margin-right:-4px}.muse{background:#d9e7f9}.muse .browser{transform:rotate(2deg)}.muse .browserbody{text-align:center;padding:22px}.muse h1{font-size:55px;max-width:490px;margin:0 auto 17px}.muse img{width:100%;height:425px;object-position:center;border-radius:16px;margin-top:22px}.pause{background:#d8e4f6;text-align:center}.pause h1{font-size:59px;max-width:540px;margin:0 auto}.pause .phone{margin:40px auto 0;transform:rotate(-7deg);height:560px}.breath{width:185px;height:185px;margin:32px auto;border-radius:50%;background:radial-gradient(circle,#eaf3ff 0 30%,#c9ddfa 31% 49%,#aecdf7 50% 65%,#dce9fc 66%);display:grid;place-items:center;color:#294c86;box-shadow:0 0 0 15px #e6edf9}.pause .float{bottom:160px;right:50px;transform:rotate(8deg)}.weather{background:#c9deff}.weather .phone{background:linear-gradient(#9fc4ff,#eff6ff);width:340px;height:650px;margin:0 auto;transform:rotate(5deg)}.sun{width:115px;height:115px;border-radius:50%;background:#fff3b5;box-shadow:0 0 70px #fff4c8;margin:45px auto 0}.cloud{width:185px;height:65px;background:white;border-radius:80px;position:relative;margin:-20px auto 0;box-shadow:0 10px 25px #4275af15}.cloud::before,.cloud::after{content:'';position:absolute;border-radius:50%;background:white;width:95px;height:95px;bottom:10px;left:22px}.cloud::after{width:72px;height:72px;left:89px;bottom:12px}.forecast{background:#ffffff80;border:1px solid white;border-radius:18px;padding:18px;margin-top:25px}.loop{background:#e7e9f4}.loop .surface{width:455px;margin:10px auto;transform:rotate(-4deg)}.loop img{height:365px;width:100%;border-radius:18px}.progress{height:4px;background:#e5e9f0;margin:24px 0 10px}.progress::before{content:'';display:block;height:4px;background:#155eef;width:42%}.play{width:64px;height:64px;display:grid;place-items:center;background:#155eef;color:#fff;border-radius:100%;font-size:21px}.index{background:#f1efe7}.index .browser{transform:rotate(-1deg)}.books{height:235px;display:flex;align-items:end;gap:9px;padding-top:20px}.book{width:85px;height:200px;background:#155eef;color:#fff;writing-mode:vertical-rl;padding:20px 13px;border-radius:3px 8px 8px 3px;font-size:20px;box-shadow:inset -8px 0 #0001}.book:nth-child(2){height:175px;background:#d9e3f5;color:#233d6d}.book:nth-child(3){height:220px;background:#26354e}.book:nth-child(4){background:#d8bda6;color:#3a2d2a;height:185px}.book:nth-child(5){height:155px;background:#9cba9b;color:#213d29}.petal{background:#e3ecd9}.petal .browser{transform:rotate(2deg)}.plant{height:280px;position:relative;display:grid;place-items:center}.pot{width:115px;height:115px;background:#b4cba8;border-radius:10px 10px 48px 48px;position:absolute;bottom:0;box-shadow:inset -22px 0 #95b28a}.stem{height:170px;width:5px;background:#4e7350;position:absolute;bottom:100px}.leaf{position:absolute;width:90px;height:55px;background:#638c63;border-radius:0 80px 0 80px;bottom:178px;left:calc(50% - 88px);transform:rotate(20deg)}.leaf.r{left:50%;bottom:202px;transform:scaleX(-1) rotate(20deg);background:#80a47b}.club{background:#e6ddfb}.club .browserbody{background:#f5f0ff}.club h1{font-size:79px;line-height:.95}.club .sticker{width:200px;height:200px;background:#155eef;color:white;display:grid;place-items:center;font-size:120px;border-radius:45px;transform:rotate(12deg);margin:35px auto}.sunday{background:#f8e4da}.sunday .browserbody{background:#fffaf6}.sunday h1{font:72px/1.05 Cormorant}.journal{padding:24px;background:#fff;border:1px solid #eadbd2;border-radius:12px;margin-top:25px}.journal p{font:22px/2 Cormorant;background:repeating-linear-gradient(transparent 0 42px,#e9e2da 43px 44px)}.wins{background:#e8e3f8}.wins .phone{width:345px;margin:0 auto;transform:rotate(-3deg);height:665px}.habit{padding:16px;border:1px solid #e4def2;border-radius:15px;margin-top:17px;background:white}.week{display:flex;gap:8px;margin-top:16px}.week i{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#155eef;color:white;font:12px Manrope}.week i:nth-last-child(-n+2){background:#edf0f8;color:#818a9f}.prism{background:#dce6f6}.prism .surface{transform:rotate(2deg);margin-top:50px;padding:0;overflow:hidden}.swatches{display:flex;height:320px}.swatches>div{flex:1;display:flex;align-items:end;justify-content:center;padding-bottom:18px;font-size:9px}.wayfinder{background:#dceae9}.landscape{height:330px;position:relative;overflow:hidden;border-radius:18px;background:#d8e5f5}.landscape .sun{height:80px;width:80px;position:absolute;top:0;right:80px}.mountain{position:absolute;width:360px;height:360px;background:#91aeaf;rotate:45deg;bottom:-240px;left:-50px;border-radius:25px}.mountain.two{left:180px;bottom:-220px;background:#547e85}.mountain.three{left:350px;bottom:-300px;background:#244c5b}.path{height:250px;width:200px;border:28px solid #e9efdf;border-radius:50%;position:absolute;left:190px;bottom:-170px;rotate:-30deg}.poster{background:#155eef;color:#f8f9fc;padding:65px}.poster h1{font:145px/.82 Cormorant;letter-spacing:-.07em;position:relative;z-index:2;margin-top:110px}.poster .star{color:#dce5f4;font-size:340px;position:absolute;right:30px;bottom:60px;transform:rotate(12deg)}.poster .caption{color:#dce5f4}.poster-min{background:#edf0f4}.poster-min h1{font-size:126px;line-height:.96;font-weight:600;margin-top:90px;position:relative;z-index:2}.ring{width:330px;height:330px;border:54px solid #155eef;border-radius:50%;position:absolute;right:80px;bottom:120px;transform:rotateX(35deg) rotateZ(-22deg);box-shadow:18px 28px 30px #1d3b7526,inset 8px 8px 15px #0b3db785}.poster-min .caption{color:#40516a}
</style><body>
<script>
const cap=(name,n)=>`<div class="caption"><span>BHOOMIKA.S / PLAYGROUND</span><span>${name.toUpperCase()} · CONCEPT ${n}</span></div>`;
const bar='<div class="browserbar"><i></i><i></i><i></i></div>';
const browser=x=>`<div class="browser">${bar}<div class="browserbody">${x}</div></div>`;
const nav=(name,links='Explore &nbsp; Studio &nbsp; About')=>`<div class="nav"><span class="brand">${name}</span><span>${links}</span><span class="pill">Let’s go ↗</span></div>`;
const head=(name,label)=>`<header><span class="brand">${name}</span><span class="tiny">${label}</span></header>`;
const art=(id,cls,body)=>{const el=document.createElement('section');el.className=`artboard ${cls}`;el.dataset.artboard=id;el.innerHTML=body;document.body.append(el)};
art('orbit','orbit',head('orbit.','A little less chaos')+'<h1>Big ideas.<br><span class="blue">Small next steps.</span></h1><p class="muted" style="margin-top:18px">A calmer home for everything you’re making.</p>'+browser(nav('orbit.','Workspace &nbsp; Inbox &nbsp; Calendar')+'<div class="row between underline"><h3>Your creative week</h3><span class="tag">Demo workspace</span></div><div class="tasks">'+['Ideas','In the making','Ready to share'].map((x,i)=>`<div class="taskcol"><small>${x}</small>${['A new beginning','Make it feel simple','Details that delight'].slice(0,3-i).map((t,j)=>`<div class="task"><span class="tag">${['Design','Explore','Build'][j]}</span><p style="margin-top:12px">${t}</p><div class="faces"><span>B</span><span>✳</span></div></div>`).join('')}</div>`).join('')+'</div>')+cap('Workspace design','01'));
art('muse','muse',browser(nav('muse ✳','Make &nbsp; Imagine &nbsp; Play')+'<span class="tag">A HOME FOR YOUR WHAT-IFS</span><h1 style="margin-top:24px">Your next idea<br>starts with <em class="blue">a little play.</em></h1><p class="muted">Collect a thought. Make a mess. Find something wonderful.</p><img src="/images/playground/blue-buddy.webp" alt=""><div class="row between" style="padding:22px 8px 4px"><b>Curiosity looks good on you.</b><span class="pill">Start exploring ↗</span></div>')+cap('Creative studio','02'));
art('pause','pause',head('pause','A softer pace')+'<h1>Nothing to finish.<br><em class="blue">Just be here.</em></h1><div class="phone"><div class="row between" style="margin-top:10px"><small>9:41</small><small>● ●</small></div><p style="margin-top:40px;font-size:11px;letter-spacing:.2em">A MOMENT FOR YOU</p><div class="breath">Breathe in</div><h2 class="serif">Make some space.</h2><p class="muted" style="font-size:12px;margin:18px 0">One small pause in a busy day.</p><span class="pill">Begin a moment</span></div><div class="float"><span class="blue">✳</span> You can take your time.</div>'+cap('Breathing interface','03'));
art('daylight','weather',head('daylight ☀','Weather, with a little wonder')+'<div class="phone"><div class="row between" style="margin-top:10px"><small>9:41</small><small>•••</small></div><p style="margin-top:28px;font-size:12px">BENGALURU · CONCEPT FORECAST</p><div class="sun"></div><div class="cloud"></div><h1 style="font-size:98px;margin-top:30px">24°</h1><p>A little cloud. A lot of possibility.</p><div class="forecast"><div class="row between"><small>Now</small><small>12 pm</small><small>2 pm</small><small>4 pm</small></div><div class="row between" style="font-size:25px;margin-top:12px"><span>☀</span><span>☁</span><span>☀</span><span>☁</span></div><div class="row between" style="margin-top:12px"><small>24°</small><small>26°</small><small>27°</small><small>25°</small></div></div></div>'+cap('Weather concept','04'));
art('loop-player','loop',head('loop ↻','Good things on repeat')+'<div class="surface"><img src="/images/playground/liquid-loop.webp" alt=""><div class="row between" style="margin-top:28px"><div><h3>Somewhere in blue</h3><p class="muted" style="font-size:13px;margin-top:6px">The daydream sessions · Concept mix</p></div><span style="font-size:27px">♡</span></div><div class="progress"></div><div class="row between muted"><small>1:24</small><small>3:40</small></div><div class="row" style="justify-content:center;gap:42px;margin-top:28px"><span>↶</span><span>◀</span><span class="play">▶</span><span>▶</span><span>↻</span></div></div>'+cap('Music player','05'));
art('index','index',head('index /','For the endlessly curious')+browser(nav('index.','Browse &nbsp; Your shelf &nbsp; Notes')+'<h1 style="font:74px/1 Cormorant">A shelf for<br><em class="blue">your next obsession.</em></h1><p class="muted" style="margin:20px 0">Good reads. Odd ideas. New perspectives.</p><div class="books">'+['Ways of seeing','Little wonders','Designing tomorrow','The art of noticing','Creative energy'].map(t=>`<div class="book">${t}</div>`).join('')+'</div><div class="row between" style="margin-top:35px;border-top:1px solid #ddd;padding-top:25px"><div><small class="muted">THIS WEEK’S SHELF</small><h3>Follow your curiosity.</h3></div><span class="pill">Take a look ↗</span></div>')+cap('Reading platform','06'));
art('petal','petal',browser(nav('petal.','Plants &nbsp; Pots &nbsp; Care')+'<h1 style="font:75px/1 Cormorant">A little green.<br><em>A lot of good.</em></h1><p class="muted" style="margin-top:17px">Find a quiet corner. Let something grow.</p><div class="plant"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div><div class="pot"></div></div><div class="surface" style="background:#f1f5ee;margin-top:30px;padding:20px"><div class="row between"><div><span class="tag" style="background:#dce8d5;color:#38523d">MEET YOUR NEW DESKMATE</span><h3 style="margin-top:8px">The everyday green</h3></div><span class="pill" style="background:#416845">Explore plants ↗</span></div></div>')+cap('Plant shop concept','07'));
art('canvas-club','club',browser(nav('canvas club','Workshops &nbsp; People &nbsp; Play')+'<span class="tiny">THE INTERNET’S LITTLE CREATIVE CORNER</span><h1 style="margin-top:25px">Make stuff.<br><em class="blue">Make a mess.</em><br>Make it yours.</h1><div class="sticker">✳</div><div class="row between"><p style="max-width:270px">A place for unfinished ideas and happy accidents.</p><span class="pill">Come play ↗</span></div>')+cap('Creative community','08'));
art('sunday','sunday',browser(nav('sunday','Today &nbsp; Pages &nbsp; Little things')+'<span class="tiny">A FRESH PAGE, JUST FOR YOU</span><h1 style="margin-top:24px">Let your thoughts<br><em style="color:#9b5a42">take the long way.</em></h1><div class="journal"><div class="row between"><span class="tiny">A NOTE TO MYSELF</span><small>✳</small></div><p style="margin-top:25px">Today, I noticed the light.<br>The way it landed on my desk.<br>Maybe the small things<br>are the whole point.</p><div class="row between" style="margin-top:30px"><small class="muted">A fictional journal entry</small><span class="pill" style="background:#9b5a42">Save this moment</span></div></div><p style="font:30px Cormorant;margin-top:30px">No perfect words required.</p>')+cap('Journal concept','09'));
art('tiny-wins','wins',head('tiny wins ✳','A little counts for a lot')+'<div class="phone"><small>9:41 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ●</small><h2 style="font:52px/1 Cormorant;margin-top:38px">Small steps.<br><em class="blue">Your pace.</em></h2><p class="muted" style="font-size:12px;margin-top:14px">A sample week, one little win at a time.</p>'+['Read a few pages','Make something','Step outside'].map((t,i)=>`<div class="habit"><div class="row between"><b style="font-size:13px">${t}</b><span class="blue">${['▤','✳','☀'][i]}</span></div><div class="week">${['M','T','W','T','F','S','S'].map(x=>`<i>${x}</i>`).join('')}</div></div>`).join('')+'<div class="row between" style="margin-top:32px;font-size:11px"><span class="blue">Today</span><span>Reflections</span><span>You</span></div></div>'+cap('Habit tracker','10'));
art('prism','prism',head('prism.','Find your kind of blue')+'<h1>A feeling,<br><em class="blue">in five shades.</em></h1><div class="surface"><div style="padding:25px"><div class="row between"><h3>Porcelain morning</h3><span>↻</span></div><p class="muted" style="font-size:12px;margin-top:8px">A palette study for curious interfaces.</p></div><div class="swatches">'+[['#F8F9FC','#172031'],['#DCE5F4','#172031'],['#8CAFEF','#172031'],['#155EEF','#fff'],['#101116','#fff']].map(([bg,fg])=>`<div style="background:${bg};color:${fg}">${bg}</div>`).join('')+'</div><div class="row between" style="padding:25px"><small>01 / COOL, CLEAR, CURIOUS</small><span class="pill">Keep this palette ♡</span></div></div>'+cap('Color tool','11'));
art('wayfinder','wayfinder',browser(nav('wayfinder','Places &nbsp; Stories &nbsp; Your list')+'<h1 style="font:75px/1 Cormorant">Go a little<br><em>off-script.</em></h1><p class="muted" style="margin:20px 0 30px">For weekends with no particular plan.</p><div class="landscape"><div class="sun"></div><div class="mountain"></div><div class="mountain two"></div><div class="mountain three"></div><div class="path"></div></div><div class="row between" style="margin-top:28px"><div><small class="muted">AN IMAGINED ESCAPE</small><h3>The quiet route</h3></div><span class="pill" style="background:#315c67">Follow the feeling ↗</span></div>')+cap('Travel editorial','12'));
art('make-room','poster',head('BS / EXPERIMENTS','TYPE STUDY 001')+'<h1>Make<br>room<br>for <em>play.</em></h1><span class="star">✳</span>'+cap('Typographic exploration','13'));
art('less-better','poster-min',head('Bhoomika.S','TYPE STUDY 002')+'<h1>Less,<br>but<br><span class="serif blue" style="font-style:italic">better.</span></h1><div class="ring"></div>'+cap('Form & restraint','14'));
</script></body></html>
