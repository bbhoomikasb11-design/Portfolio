<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Landing page studies — Bhoomika S</title>
<style>
@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-400.woff2')}@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-600.woff2');font-weight:600}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-normal-400.woff2')}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-italic-400.woff2');font-style:italic}
*{box-sizing:border-box}body{margin:0;background:#ddd;color:#20231e;font:16px/1.6 Manrope}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.05}h1{font-size:90px;letter-spacing:-.065em}h2{font-size:56px;letter-spacing:-.045em}h3{font-size:26px;letter-spacing:-.03em}p{max-width:540px}img{display:block;width:100%;height:100%;object-fit:cover}small,.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase}em{font-family:Cormorant;font-weight:400}.serif{font-family:Cormorant;letter-spacing:-.045em;font-weight:400}.artboard{width:1000px;min-height:2400px;margin-bottom:80px;background:#fff;display:flex;flex-direction:column;position:relative;isolation:isolate}.nav{padding:28px 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid currentColor}.nav .links{font-size:12px;word-spacing:18px}.brand{font-size:27px;font-weight:600;letter-spacing:-.06em}.button{display:inline-block;padding:14px 24px;font-size:13px;background:var(--accent,#222);color:var(--on,#fff);line-height:1.3}.outline{background:transparent;color:inherit;border:1px solid currentColor}.pad{padding:64px 48px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:36px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.flex{display:flex;justify-content:space-between;align-items:center;gap:24px}.mt{margin-top:28px}.sub{font-size:14px;line-height:1.8}.rule{border-top:1px solid currentColor;padding-top:22px;margin-top:30px}.photo{overflow:hidden}.foot{margin-top:auto;padding:42px 48px 24px}.foot .large{font-size:100px;line-height:1.1;letter-spacing:-.07em}.colophon{display:flex;justify-content:space-between;margin-top:36px;padding-top:18px;border-top:1px solid currentColor;font-size:9px;letter-spacing:.05em}.fine{font-size:12px}.label{display:inline-block;border:1px solid currentColor;padding:6px 10px;font-size:10px;letter-spacing:.1em}.list-row{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-top:1px solid currentColor}.list-row h3{font-size:22px}.number{font-size:12px;opacity:.7}.round{border-radius:50%}
/* A neighbourhood bakery: warm paper, ink-red type, a handwritten menu rhythm. */
.bakery{background:#f4ebd9;color:#7c201e;--accent:#7c201e}.bakery .nav{border:0}.bakery .brand{font:40px Cormorant}.bakery-hero{padding:28px 48px 0;text-align:center}.bakery-hero h1{font:116px/.85 Cormorant;letter-spacing:-.06em}.bakery-hero .photo{height:410px;margin-top:36px;border-radius:230px 230px 0 0}.bakery .ribbon{padding:17px;background:#7c201e;color:#f4ebd9;text-align:center;letter-spacing:.16em;font-size:12px}.bakery .menu{padding:60px 68px}.bakery .menu h2{font:66px Cormorant}.bakery .menu .list-row{padding:20px 0;border-color:#7c201e55}.bread-stamp{width:170px;height:170px;border:1px dashed #7c201e;border-radius:50%;display:grid;place-content:center;text-align:center;transform:rotate(9deg);font:38px/1 Cormorant}.bakery .note{background:#eadcc0;padding:46px;font:30px/1.25 Cormorant;transform:rotate(-2deg)}.bakery .visit{background:#7c201e;color:#f4ebd9;padding:58px 48px}.bakery .foot{background:#f4ebd9}.bakery .foot .large{font-family:Cormorant;font-size:135px}
/* Architecture: precise edges, quiet project captions, generous white margins. */
.architecture{background:#efeee9;color:#282b27;--accent:#282b27}.architecture .nav{border-bottom-color:#babbb4}.architecture .brand{font-size:22px;letter-spacing:.1em}.arch-hero{padding:50px 48px 0}.arch-hero h1{font:96px/.95 Cormorant;max-width:750px}.arch-hero .photo{height:535px;margin-top:40px}.architecture .caption{display:flex;justify-content:space-between;margin-top:14px;font-size:11px}.architecture .project-sketch{height:330px;background:#d7d7cd;display:grid;place-items:center}.architecture .project-sketch svg{width:90%;height:90%}.architecture .statement{padding:60px 100px;border-block:1px solid #b5b7ac;font:44px/1.15 Cormorant}.architecture .foot{background:#d6d8ce}
/* Cycling: hard contrast, oversized condensed-feeling typesetting, product facts. */
.cycle{background:#d9ef58;color:#171d19;--accent:#171d19}.cycle .nav{border-bottom-color:#171d1955}.cycle .brand{font-style:italic;font-size:32px}.cycle-hero{padding:38px 48px 0}.cycle-hero h1{font-size:128px;line-height:.83;font-weight:600;letter-spacing:-.09em}.cycle-hero .photo{height:450px;margin-top:30px}.cycle .specs{background:#171d19;color:#eef2e7;padding:28px 48px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.cycle .specs b{display:block;font-size:34px;font-weight:400}.cycle .route{border:1px solid #171d1970;padding:32px;background:#e6f2a5}.cycle .route svg{width:100%;height:220px}.cycle .service{background:#f5f4e9;padding:52px 48px}.cycle .foot{background:#171d19;color:#d9ef58}.cycle .foot .large{font-size:112px;font-style:italic}
/* Pottery: close human detail, warm oxides and irregular vessel drawings. */
.clay{background:#eee5dc;color:#4d3025;--accent:#864b35}.clay .nav{border:0}.clay .brand{font:33px Cormorant}.clay-hero{padding:32px 48px 60px}.clay-hero h1{font:112px/.91 Cormorant}.clay-hero .photo{height:525px;border-radius:200px 200px 8px 8px}.clay-hero .intro{padding-top:65px}.clay .workshop{background:#d7b9a3;padding:54px 48px}.clay .vessel{height:220px;background:#e2d4c5;display:grid;place-items:center}.clay .vessel svg{height:190px;width:100%}.clay .foot{background:#573a2e;color:#f0e5da}.clay .foot .large{font-family:Cormorant;font-size:120px}
/* Coffee bar: newsprint menu, oxblood and a strong photographic opening. */
.coffee{background:#f5f0e7;color:#32211e;--accent:#6c292c}.coffee .nav{background:#6c292c;color:#f5f0e7;border:0}.coffee .brand{font-size:24px;letter-spacing:.03em}.coffee-hero{display:grid;grid-template-columns:1fr 1fr;min-height:620px}.coffee-hero .intro{padding:65px 42px;background:#6c292c;color:#f5f0e7}.coffee-hero h1{font:100px/.95 Cormorant}.coffee .menu-board{padding:48px;border:1px solid #6c292c;margin:55px 48px;background:#eee5d5}.coffee .menu-board h2{font-size:56px;letter-spacing:.1em}.coffee .menu-board .list-row{border-color:#6c292c44;padding:18px 0}.coffee .story{padding:20px 48px 55px}.coffee .story .photo{height:370px}.coffee .hours{padding:48px;background:#d9a088;color:#492427}.coffee .foot{background:#6c292c;color:#f5f0e7}
/* Produce: friendly supermarket type, big fruit photography, useful information. */
.market{background:#f7f5e8;color:#1c4c2d;--accent:#1c4c2d}.market .nav{border-bottom-color:#1c4c2d33}.market .brand{font-size:36px;letter-spacing:-.07em}.market-hero{padding:40px 48px 0}.market-hero h1{font-size:104px;line-height:.94}.market-hero .photo{height:405px;margin-top:34px}.market .ticker{padding:16px;background:#e3ed7a;text-align:center;font-size:12px;letter-spacing:.13em}.market .box{background:#e5ebc6;padding:30px;min-height:235px}.market .box h3{font-size:32px}.market .box .price{font:60px/1 Cormorant;margin-top:22px}.market .season{padding:52px 48px;background:#1c4c2d;color:#f3f3dc}.market .season span{font:68px Cormorant;display:block}.market .foot{background:#e3ed7a}.market .foot .large{font-size:116px}
/* Travel journal: a magazine cover, honest itinerary, captions and long-form text. */
.journal{background:#f0efe8;color:#303e45;--accent:#303e45}.journal .brand{font:42px Cormorant}.journal .nav{border-color:#303e4544}.journal-hero{padding:38px 48px 0}.journal-hero h1{font:112px/.95 Cormorant}.journal-hero .photo{height:520px;margin-top:28px}.journal .story-title{font:54px/1.05 Cormorant}.journal .columns{column-count:2;column-gap:40px;font:23px/1.55 Cormorant}.journal .columns p{margin-bottom:18px}.journal .itinerary{background:#d9e1df;padding:48px}.journal .itinerary .list-row{border-color:#303e4544}.journal .foot{background:#303e45;color:#f0efe8}.journal .foot .large{font-family:Cormorant;font-size:130px}
/* Software: utilitarian blue, useful UI, precise copy; no imaginary user counts. */
.queue{background:#f6f7fb;color:#172438;--accent:#2759db}.queue .nav{border-bottom-color:#d5dce7}.queue .brand{font-size:30px}.queue-hero{padding:48px 48px 0}.queue-hero h1{font-size:86px;max-width:800px}.queue .app{margin-top:40px;background:#fff;border:1px solid #cbd3e1;box-shadow:0 15px 40px #142b4c0d;display:grid;grid-template-columns:165px 1fr;min-height:420px;font-size:12px}.queue .sidebar{background:#e9edf5;padding:24px 20px}.queue .sidebar p{padding:12px 0;font-size:12px}.queue .app-main{padding:28px}.queue .app-row{display:grid;grid-template-columns:24px 1fr 90px;align-items:center;border-top:1px solid #e1e6ee;padding:18px 0;font-size:12px}.queue .tag{padding:4px 8px;background:#e4ecff;color:#2149a8;font-size:10px}.queue .features{padding:56px 48px}.queue .feature{border-top:1px solid #c4cfe0;padding-top:24px}.queue .feature h3{font-size:26px;margin:20px 0 14px}.queue .workflow{padding:48px;background:#e5ebfa}.queue .mini{padding:24px;background:white;border:1px solid #c4cfe0}.queue .faq{padding:48px}.queue .faq .list-row{border-color:#c4cfe0}.queue .foot{background:#2759db;color:white}
</style></head><body><script>
const img=(name,style='')=>`<div class="photo" style="${style}"><img src="/design/playground/photos/${name}.jpg" alt=""></div>`;
const nav=(brand,links,action)=>`<header class="nav"><span class="brand">${brand}</span><span class="links">${links}</span><span class="fine">${action} ↗</span></header>`;
const button=(text,extra='')=>`<span class="button ${extra}">${text} ↗</span>`;
const foot=(title,detail)=>`<footer class="foot"><div class="large">${title}</div><div class="flex mt"><p class="fine">${detail}</p><span class="fine">Back to the top ↑</span></div><div class="colophon"><span>BHOOMIKA.S / INDEPENDENT DESIGN STUDY</span><span>FICTIONAL BRAND · SAMPLE CONTENT</span></div></footer>`;
const board=(id,cls,html)=>{const e=document.createElement('article');e.className=`artboard ${cls}`;e.dataset.artboard=id;e.innerHTML=html;document.body.append(e)};
const rows=items=>items.map(([a,b,c])=>`<div class="list-row"><div><h3>${a}</h3>${c?`<p class="fine" style="margin-top:6px">${c}</p>`:''}</div><span>${b}</span></div>`).join('');
board('daily-bread','bakery',nav('daily bread','The counter &nbsp; Our kitchen','Find us')+`<section class="bakery-hero"><p class="eyebrow" style="margin:0 auto 24px">A neighbourhood bakery. Early starts. Good crusts.</p><h1>Save room<br>for the heel.</h1>${img('bread')}</section><div class="ribbon">FLOUR · WATER · SALT · TIME · NOTHING TO HIDE</div><section class="menu"><div class="flex"><div><small>From the oven</small><h2>On the counter today</h2></div><div class="bread-stamp">Baked<br>before<br>breakfast.</div></div>${rows([['The everyday sourdough','₹280','A slow-fermented loaf. Crisp outside, soft enough for tomorrow’s toast.'],['Seeded tin loaf','₹240','Sunflower, sesame and a very generous slice.'],['Cinnamon knot','₹95','A little sticky. Best eaten before you reach home.']])}<p class="fine mt">The menu is small on purpose. When a batch is gone, the next one takes its time.</p></section><section class="pad grid"><div><small>A note from the kitchen</small><h2 class="serif mt">Bread doesn’t<br>watch the clock.</h2><p class="sub mt">We mix in the afternoon, let the dough rest overnight, and turn the ovens on while the street is still quiet. Some days the crust is darker. That’s part of baking.</p></div><div class="note">“Cut a thick slice.<br>Toast it a little too long.<br>Add salted butter.<br>That’s breakfast.”<p class="fine mt" style="font-family:Manrope">A serving suggestion from our imaginary kitchen.</p></div></section><section class="visit grid"><div><small>Come by</small><h2 class="serif mt">Follow the smell.</h2></div><div><p>Tuesday–Sunday · 7:30 am–2 pm<br>Closed Mondays. The dough gets a day off too.</p><p class="fine mt">Bring a bag, or take one of our paper ones.<br>Ask at the counter about ingredients and allergens.</p><div class="mt">${button('See the bake list','outline')}</div></div></section>`+foot('daily bread','A loaf for the table. A knot for the walk home.'));
board('room-sixteen','architecture',nav('ROOM / 16','Projects &nbsp; Approach &nbsp; Studio','Start a conversation')+`<section class="arch-hero"><div class="flex"><small>Architecture & interior practice</small><small>Selected spaces / 01—03</small></div><h1 class="mt">A room should<br>make room for you.</h1>${img('interior')}<div class="caption"><span>01 / The courtyard house — spatial study</span><span>Light, timber, and a place to gather.</span></div></section><section class="pad grid"><h2 class="serif">We start with<br>how you live.</h2><div><p class="sub">Where do you leave your keys? Which window gets the morning sun? Who ends up in the kitchen? Small questions tell us more than a moodboard can.</p><p class="sub mt">Our work begins there: with the routines a space needs to hold, before the materials that will cover it.</p></div></section><section style="padding:0 48px 60px"><div class="flex"><h2 class="serif">Spaces in progress</h2><small>Concept portfolio</small></div><div class="grid mt"><div><div class="project-sketch"><svg viewBox="0 0 400 300" fill="none" stroke="#4d5749" stroke-width="2"><path d="M45 35H355V265H45ZM45 125H240V35M240 125V265M135 125V265M240 195H355M65 55H215V105H65ZM260 55H335V175H260Z"/><path d="M155 145h65v90h-65zM65 150h50v65H65zM265 215h65v30h-65z"/><circle cx="183" cy="185" r="18"/><path d="M15 35V265M10 35h10M10 265h10M45 285H355" stroke-width="1"/></svg></div><div class="caption"><span>02 / A compact city apartment</span><span>Plan study</span></div></div><div>${img('interior','height:330px;')}<div class="caption"><span>03 / A quieter dining room</span><span>Material study</span></div></div></div></section><section class="statement">More daylight.<br>Fewer things in the way.<br>Enough space to change your mind.</section><section class="pad"><div class="grid"><div><small>The way we work</small><h2 class="serif mt">A clear process.<br>An open conversation.</h2></div><div>${rows([['01 / Listen','↗','A site visit and a conversation about daily life.'],['02 / Draw','↗','Plans, material samples, and room to question things.'],['03 / Make','↗','Detailing the decisions that make a space work.']])}</div></div></section>`+foot('Let’s make room.','Tell us about the space you have in mind.'));
board('kilometre','cycle',nav('kilometre.','Bikes &nbsp; Workshop &nbsp; Rides','Find your ride')+`<section class="cycle-hero"><small>For the ride there. And the long way back.</small><h1 class="mt">TAKE THE<br>LONG WAY.</h1>${img('bicycle')}</section><section class="specs"><div><small>The frame</small><b>Steel.</b><span class="fine">Made for the everyday road.</span></div><div><small>The approach</small><b>Simple.</b><span class="fine">Less to adjust. More to ride.</span></div><div><small>The destination</small><b>Your call.</b><span class="fine">The café counts as a destination.</span></div></section><section class="pad grid"><div><small>A bicycle, not a complicated decision.</small><h2 class="mt">GOOD FIT.<br>GOOD BRAKES.<br>OFF YOU GO.</h2></div><div><p>Pick a frame that fits. Set the saddle properly. Learn how to fix a flat. We’d rather help you enjoy the first kilometre than overwhelm you with the next thousand.</p><div class="mt">${button('Find your frame size')}</div><p class="fine mt">Product imagery is a visual reference for this shop concept.</p></div></section><section style="padding:0 48px 60px"><div class="flex"><h2>THE SUNDAY LOOP</h2><span class="label">NO ONE LEFT BEHIND</span></div><div class="route mt"><div class="flex"><p class="sub">An easy start, a lakeside stretch,<br>and a very necessary coffee stop.</p><strong>28 km / easy pace</strong></div><svg viewBox="0 0 800 220" fill="none"><path d="M35 160C100 160 100 45 195 45S290 190 385 180S490 45 595 65S690 160 765 45" stroke="#243b26" stroke-width="5" stroke-dasharray="10 7"/><g fill="#243b26"><circle cx="35" cy="160" r="9"/><circle cx="385" cy="180" r="9"/><circle cx="765" cy="45" r="9"/></g><g fill="#243b26" font-size="16" font-family="Manrope"><text x="20" y="200">Start / 06:30</text><text x="340" y="145">Coffee stop</text><text x="650" y="20">Back for breakfast</text></g></svg><p class="fine">Illustrative route · Helmet, water bottle, spare tube. That’s the list.</p></div></section><section class="service grid"><div><small>At the workshop</small><h2 class="mt">A little care.<br>A lot more miles.</h2></div><div>${rows([['Brake check','01'],['Gear adjustment','02'],['Puncture repair','03']])}<p class="fine mt">Bring the bike in. Tell us what feels wrong. We’ll take a look together.</p></div></section>`+foot('SEE YOU OUT THERE.','Start slowly. Stop for coffee. Ride home happy.'));
const vessel=(kind)=>`<svg viewBox="0 0 250 220"><ellipse cx="125" cy="198" rx="72" ry="8" fill="#b8a18c" opacity=".4"/><path d="${kind===0?'M80 55Q68 55 72 85L82 180Q125 205 168 180L178 85Q182 55 170 55Z':kind===1?'M65 105Q70 185 125 190Q180 185 185 105Z':'M100 30L100 75Q60 100 68 165Q75 195 125 195Q175 195 182 165Q190 100 150 75L150 30Z'}" fill="${['#a4684c','#bca88d','#746f52'][kind]}"/><ellipse cx="125" cy="${[55,105,30][kind]}" rx="${[47,60,25][kind]}" ry="10" fill="#4f3e30"/><path d="M92 100Q85 145 98 170" stroke="#d8b59a" opacity=".45" fill="none" stroke-width="4"/></svg>`;
board('hand-earth','clay',nav('hand & earth','Objects &nbsp; Workshops &nbsp; Our process','Visit the studio')+`<section class="clay-hero grid"><div class="intro"><small>Clay, made useful.</small><h1 class="mt">A little<br>uneven.<br>Entirely<br>yours.</h1><p class="sub mt">Cups to wrap both hands around.<br>Bowls that belong on the table,<br>not just the shelf.</p></div>${img('ceramics')}</section><section class="workshop"><div class="grid"><div><small>Saturday at the wheel</small><h2 class="serif mt">Your first pot<br>might lean a little.</h2></div><div><p>That’s fine. Learn to centre the clay, pull up the walls, and let the shape tell you when to stop. We’ll handle the firing after your piece has dried.</p><p class="fine mt">Beginner session · Clay and tools included<br>Wear something you don’t mind getting muddy.</p><div class="mt">${button('Find a workshop')}</div></div></div></section><section class="pad"><div class="flex"><h2 class="serif">Objects for ordinary days.</h2><small>Form studies / 01—03</small></div><div class="grid3 mt">${['The morning cup','The generous bowl','A stem or two'].map((t,i)=>`<div><div class="vessel">${vessel(i)}</div><h3 class="serif mt">${t}</h3><p class="fine mt">${['A thumb rest, a wide handle, a good start.','For noodles, leftovers, and second helpings.','A quiet corner of the kitchen table.'][i]}</p></div>`).join('')}</div></section><section class="pad grid" style="padding-top:0"><div>${img('ceramics','height:330px')}</div><div><small>How a pot becomes a pot</small><h2 class="serif mt">Some things<br>can’t be hurried.</h2><p class="sub mt">Throw. Trim. Dry. Fire. Glaze. Fire again. There are days of waiting between the parts you see. Each mark is a record of a hand, a tool, or a turn of the wheel.</p></div></section><section style="padding:0 48px 55px">${rows([['Before you visit','01','No experience needed. Short nails help. Curiosity is enough.'],['After your session','02','Leave your piece with the studio for drying and firing.'],['When it comes home','03','Wash gently. Use often. A handmade cup is still a cup.']])}</section>`+foot('Put your hands to it.','A fictional pottery studio. A study in texture, process and useful objects.'));
board('third-cup','coffee',nav('THIRD CUP','Menu &nbsp; The bar &nbsp; Find us','Come on in')+`<section class="coffee-hero"><div class="intro"><small>A coffee bar for staying a while.</small><h1 class="mt">Your usual.<br>Or something<br>new.</h1><p class="sub mt">A short coffee at the bar.<br>A long conversation by the window.<br>We have room for both.</p><div class="mt">${button('What’s brewing','outline')}</div></div>${img('coffee')}</section><section class="menu-board"><div class="flex"><h2>AT THE BAR</h2><small>Sample menu</small></div><div class="grid mt"><div>${rows([['Espresso','₹120','Short, balanced, no distractions.'],['Flat white','₹180','A double shot and silky milk.'],['Filter coffee','₹160','Ask us what’s on the grinder.']])}</div><div>${rows([['Iced latte','₹190','Cold milk. Espresso. Plenty of ice.'],['Cold brew','₹180','Brewed slowly, served simply.'],['Not coffee','₹140','Tea, chocolate, or sparkling citrus.']])}</div></div><p class="fine mt">Oat milk available. Tell us how you like it.</p></section><section class="story grid">${img('coffee')}<div style="padding:28px 0"><small>Behind the bar</small><h2 class="serif mt">Good coffee<br>starts with<br>paying attention.</h2><p class="sub mt">To the grind, the water, and the person waiting for their drink. You don’t need to know the tasting notes. Just tell us if you like it bright, strong, or with a little more milk.</p></div></section><section class="hours grid"><div><small>Make yourself comfortable</small><h2 class="serif mt">There’s a seat<br>by the window.</h2></div><div>${rows([['Monday–Friday','8 am–7 pm'],['Saturday–Sunday','9 am–6 pm']])}<p class="fine mt">Walk-ins welcome. Dogs on the pavement, laptops at the long table, conversations everywhere.</p></div></section><section class="pad"><small>For your own kitchen</small><div class="flex mt"><h2 class="serif">Take the good beans home.</h2>${button('Ask about this week’s roast')}</div><p class="sub mt">Whole bean or ground for your brewer. Tell us what you’re using and we’ll help you get started.</p></section>`+foot('ONE MORE CUP?','A coffee-bar identity and landing-page concept.'));
board('patch-market','market',nav('patch.','This week &nbsp; The boxes &nbsp; How it works','Build your box')+`<section class="market-hero"><div class="flex"><small>Your neighbourhood produce box</small><small>Seasonal by nature</small></div><h1 class="mt">GOOD FOOD.<br>ODD SHAPES.<br>ALL WELCOME.</h1>${img('tomatoes')}</section><div class="ticker">PICKED FOR FLAVOUR. PACKED FOR YOUR WEEK.</div><section class="pad"><div class="flex"><h2>What’s in your kitchen?</h2><small>Illustrative box options</small></div><p class="sub mt">Start with what you actually cook. Swap what you won’t use.</p><div class="grid mt"><div class="box"><small>For one or two</small><h3 class="mt">The everyday box</h3><p class="sub mt">Tomatoes, greens, potatoes, onions, and one seasonal surprise.</p><p class="price">₹450 <small>/ box</small></p></div><div class="box" style="background:#e9d9bf"><small>A fuller table</small><h3 class="mt">The family box</h3><p class="sub mt">More of the staples, extra fruit, and enough greens to share.</p><p class="price">₹750 <small>/ box</small></p></div></div></section><section class="season"><small>On the board this week</small><div class="grid3 mt"><div><span>Tomatoes</span><p class="fine">Slice with salt. Leave the fancy recipe for another day.</p></div><div><span>Greens</span><p class="fine">Wash, dry, and tuck into a cloth before refrigerating.</p></div><div><span>Potatoes</span><p class="fine">A dark, cool cupboard. Keep them away from the onions.</p></div></div></section><section class="pad grid"><div><small>Nothing complicated</small><h2 class="mt">YOU PICK.<br>WE PACK.<br>YOU COOK.</h2></div><div>${rows([['01 / Choose a box','↗','Pick a size that works for your household.'],['02 / Make a few swaps','↗','Skip the brinjal if nobody at home eats it.'],['03 / Put the kettle on','↗','Unpack, store the greens, and plan dinner.']])}</div></section><section style="padding:0 48px 60px"><div class="rule flex"><h3>Small question?</h3><p class="sub">Delivery windows, substitutions, or what to do with all those tomatoes—there’s room to ask before you order.</p></div></section>`+foot('EAT WHAT’S IN SEASON.','A fictional produce service. Prices and availability are sample content.'));
board('fieldwork','journal',nav('fieldwork','Stories &nbsp; Routes &nbsp; The journal','Read issue 04')+`<section class="journal-hero"><div class="flex"><small>Issue 04 / Taking the slower road</small><small>An independent travel journal</small></div><h1 class="mt">A few days<br>without a plan.</h1>${img('mountains')}<p class="fine mt">From the visual notebook / An alpine landscape, photographed in daylight.</p></section><section class="pad"><div class="grid"><div><small>The opening story</small><h2 class="story-title mt">We came for the view.<br>We stayed for<br>the quiet.</h2></div><p class="sub">An imagined field note about leaving space in the itinerary. No list of ten things you must do. Just a walk, a packed lunch, and enough daylight to take the longer path back.</p></div><div class="columns mt"><p>The best part of the morning was the hour we hadn’t booked. We followed the path until the houses thinned out, stopped where the trees opened, and sat on a low wall with the last of the bread.</p><p>There wasn’t much to photograph that we hadn’t already seen. The light changed. A cloud moved across the ridge. Someone pointed out a bird neither of us could name.</p><p>By the time we turned around, the route on the map mattered less. We knew where we had stopped, which turn we had nearly missed, and how long a quiet morning could feel.</p></div></section><section class="itinerary"><div class="flex"><h2 class="serif">A loose itinerary.</h2><small>For a weekend that can change</small></div>${rows([['Friday / Arrive before dark','01','Unpack. Find dinner. Ask someone which path they walk.'],['Saturday / Follow your feet','02','An early start, a packed lunch, a route you can shorten.'],['Sunday / Leave some time','03','One last walk before the journey home.']])}</section><section class="pad grid"><div>${img('mountains','height:350px')}</div><div><small>From the notebook</small><h2 class="serif mt">What we<br>actually packed.</h2><p class="sub mt">A rain layer. A paper map. Water. Two pairs of socks. A book we barely opened. Less camera equipment than last time.</p><div class="mt">${button('Read the packing note','outline')}</div></div></section>`+foot('Go. Notice. Write.','Editorial concept · Landscape photography used as visual reference.'));
board('queue-desk','queue',nav('queue','Product &nbsp; How it works &nbsp; Help','Open a workspace')+`<section class="queue-hero"><span class="label">A project desk for small teams</span><h1 class="mt">Know what’s next.<br>Then get back to it.</h1><p class="mt">Tasks, decisions and the file everyone keeps asking for.<br>One place to leave them. One less message to send.</p><div class="mt">${button('Try a sample workspace')} <span class="fine" style="margin-left:20px">No signup needed for the concept.</span></div><div class="app"><aside class="sidebar"><strong>Studio workspace</strong><p class="mt">⌂ Overview</p><p style="color:#2759db">▤ Website refresh</p><p>▤ Content calendar</p><p>▤ Studio admin</p><p class="mt">+ New project</p></aside><div class="app-main"><div class="flex"><small>Website refresh</small><span class="tag">Sample workspace</span></div><h3 class="mt">This week, in one place.</h3><div class="flex mt"><span>To do · 3</span><span class="fine">Assigned to everyone ↓</span></div>${[['○','Check the mobile navigation','Maya'],['○','Choose the cover photograph','Rohan'],['○','Write the contact-page copy','You'],['✓','Agree on the page structure','Done']].map(r=>`<div class="app-row"><span>${r[0]}</span><span>${r[1]}</span><span class="tag">${r[2]}</span></div>`).join('')}<p class="fine mt">+ Add a task</p></div></div></section><section class="features"><div class="grid3">${[['01','Less status chasing.','See who owns the next step without opening a second conversation.'],['02','Decisions stay put.','Keep the agreed direction beside the work, where someone can find it.'],['03','Files have a home.','The latest draft is attached to the task. Not buried in yesterday’s messages.']].map(([n,t,d])=>`<div class="feature"><small>${n}</small><h3>${t}</h3><p class="sub">${d}</p></div>`).join('')}</div></section><section class="workflow"><div class="grid"><div><small>A handover that makes sense</small><h2 class="mt">Leave a note<br>for the next<br>person.</h2><p class="sub mt">What changed? What needs a look? A little context is often all it takes to keep a project moving.</p></div><div class="mini"><small>Contact page / discussion</small><h3 class="mt">Ready for a second look</h3><p class="sub mt">“I shortened the form to three fields and added an email option. Could you check the spacing on a smaller screen?”</p><div class="rule"><span class="tag">contact-page-v3.fig</span><p class="fine mt">Maya · Sample comment</p></div><div class="rule fine">Write a reply…</div></div></div></section><section class="faq"><h2>Before you start.</h2>${rows([['Do I need to move everything at once?','+','Start with one project. Bring the rest over when it makes sense.'],['Can I keep a project small?','+','Yes. A title, a few tasks and one person is a perfectly good start.'],['Is this a live product?','+','This is a product-design concept with an illustrative workspace.']])}</section>`+foot('Less chasing. More doing.','An original software landing-page and interface study.'));
</script></body></html>
