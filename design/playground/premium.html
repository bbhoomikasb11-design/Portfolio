<!doctype html><html lang="en"><meta charset="utf-8"><title>Premium interface studies — Bhoomika S</title><style>
@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-400.woff2')}@font-face{font-family:Manrope;src:url('/fonts/manrope-normal-600.woff2');font-weight:600}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-normal-400.woff2')}@font-face{font-family:Cormorant;src:url('/fonts/cormorant-garamond-italic-400.woff2');font-style:italic}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Manrope;background:#ddd;color:#20231e}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.05}h1{font-size:80px;letter-spacing:-.05em}h2{font-size:46px;letter-spacing:-.04em}h3{font-size:22px;letter-spacing:-.02em}small,.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase}.artboard{width:1000px;position:relative;margin-bottom:40px;overflow:hidden}.flex{display:flex;align-items:center;justify-content:space-between;gap:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.serif{font-family:Cormorant;font-weight:400}em{font-family:Cormorant;font-weight:400}img{display:block;width:100%;height:100%;object-fit:cover}.nav{display:flex;align-items:center;justify-content:space-between;padding:30px 48px;font-size:11px;letter-spacing:.02em}.nav .brand{font-size:25px;letter-spacing:-.04em}.pill{display:inline-block;border-radius:50px;padding:12px 22px;font-size:12px;line-height:1.2;background:var(--accent,#293731);color:var(--on,#fff)}.outline{border:1px solid currentColor;background:transparent;color:inherit}.mt{margin-top:24px}.fine{font-size:12px;line-height:1.7}.rule{padding-top:24px;border-top:1px solid currentColor}.colophon{padding:20px 48px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.08em;text-transform:uppercase}
/* Quiet hospitality, composed around a documentary landscape. */
.stillwater{background:#f0eee7;color:#203b35;--accent:#203b35}.stillwater .nav{position:absolute;inset:0 0 auto;color:#fff;z-index:2}.stillwater .nav .brand{letter-spacing:.18em;font-size:19px}.stay-hero{height:745px;position:relative;background:#253f3c}.stay-hero img{opacity:.79}.stay-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,#0a282b99)}.stay-title{position:absolute;bottom:60px;left:48px;right:48px;z-index:1;color:#fff}.stay-title h1{font:112px/.88 Cormorant;letter-spacing:-.045em}.stay-booking{margin:-25px 48px 0;position:relative;z-index:3;background:#fffdf6;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:28px;padding:25px 30px;box-shadow:0 10px 30px #11292112}.stay-booking b{display:block;font-size:14px;margin-top:5px;font-weight:400}.stay-note{padding:70px 48px 50px}.stay-note h2{font:62px/.95 Cormorant}.stay-note p{font-size:14px;line-height:1.85}.stay-rooms{padding:0 48px 45px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.stay-room{padding:24px;background:#e2e5da;border-top:1px solid #203b3566}.stay-room h3{font:31px Cormorant}.stillwater .colophon{border-top:1px solid #c6ccc0}
/* A listening room: blackened paper, a vinyl record built in CSS, mint ink. */
.nocturne{background:#171c1b;color:#e7eadf;--accent:#d5e8c0;--on:#1b271e}.nocturne .nav{border-bottom:1px solid #e7eadf22}.nocturne .brand{font:32px Cormorant}.listen-hero{padding:50px 48px 48px;position:relative;overflow:hidden}.listen-hero h1{font:116px/.87 Cormorant;letter-spacing:-.04em;position:relative;z-index:2}.listen-hero p{max-width:330px;font-size:14px;color:#bcc4ba}.record{width:415px;height:415px;border-radius:50%;position:absolute;right:25px;top:100px;background:repeating-radial-gradient(circle at center,#151717 0 2px,#303835 3px,#171d1b 4px,#141918 6px);box-shadow:inset 4px 3px 10px #ffffff15,10px 25px 40px #0007;border:1px solid #455047;transform:rotate(-20deg)}.record:before{content:'';position:absolute;inset:32%;border-radius:50%;background:#becfa8}.record:after{content:'SIDE A / 33⅓';position:absolute;inset:43% 30%;color:#26372e;text-align:center;font-size:13px;letter-spacing:.1em}.record-pin{position:absolute;width:11px;height:11px;left:calc(50% - 5px);top:calc(50% - 5px);background:#151b18;border:2px solid #dbe8ce;border-radius:50%;z-index:1}.listen-caption{margin-top:76px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em}.set-list{background:#d5e0c9;color:#22352b;padding:42px 48px}.set-list h2{font-size:39px}.set-row{display:grid;grid-template-columns:75px 1fr 150px;gap:20px;padding:24px 0;border-bottom:1px solid #22352b33;align-items:center}.set-row h3{font:32px Cormorant}.set-row p{font-size:11px}.room-note{padding:45px 48px;display:grid;grid-template-columns:1fr 1fr;gap:55px}.room-note h2{font:52px Cormorant}.room-note p{font-size:13px;color:#bec8be}.nocturne .colophon{border-top:1px solid #e7eadf22;color:#bec8be}
/* A lighting catalogue: photographic product detail and a deliberately spare index. */
.forme{background:#efefeb;color:#2e302c;--accent:#2e302c}.forme .brand{font-size:33px;letter-spacing:.12em}.forme .nav{border-bottom:1px solid #cacdc4}.forme-title{padding:42px 48px 30px}.forme-title h1{font:102px/.94 Cormorant}.forme-photo{height:600px;position:relative}.forme-photo img{object-position:center 46%}.forme-label{position:absolute;bottom:35px;left:48px;background:#f5f4eedf;padding:23px 28px;min-width:250px}.forme-label h3{font:35px Cormorant}.material-list{padding:45px 48px}.material-list .grid{align-items:end}.material-list h2{font:57px/.95 Cormorant}.finish{width:42px;height:42px;border-radius:50%;border:3px solid #fff;display:inline-block;margin-left:-4px;background:#b3a08a}.finish:nth-child(2){background:#3e423e}.finish:nth-child(3){background:#d9d7cc}.forme-meta{margin-top:34px;padding-block:22px;border-block:1px solid #bfc4b8;display:grid;grid-template-columns:repeat(3,1fr);gap:25px;font-size:12px}.forme-meta b{display:block;font-weight:400;margin-top:8px;font-size:17px}.forme .colophon{background:#dfe2d8}
/* A restrained financial workspace, with explicitly illustrative figures. */
.margin{background:#ececf3;color:#27243e;--accent:#6651ca}.margin .nav{background:#f7f7fa;border-bottom:1px solid #d9d8e3}.margin .brand{font-size:29px}.margin-hero{padding:45px 48px 30px}.margin-hero h1{font:87px/.98 Cormorant;max-width:730px}.margin-hero p{max-width:550px;font-size:14px;line-height:1.8}.ledger{margin:12px 48px 0;background:#fff;border:1px solid #d3d3e3;border-radius:12px;overflow:hidden;box-shadow:0 18px 30px #3531510a}.ledger-top{padding:20px 26px;background:#fafafe;border-bottom:1px solid #e8e7f0;font-size:11px}.ledger-main{display:grid;grid-template-columns:145px 1fr;min-height:425px}.ledger-aside{padding:24px 20px;background:#f5f4fa;font-size:11px}.ledger-aside p{padding:12px 0}.ledger-content{padding:28px}.ledger-figures{display:grid;grid-template-columns:1fr 1fr;gap:24px}.ledger-figures strong{display:block;font-size:35px;font-weight:400;letter-spacing:-.05em;margin-top:8px}.ledger-chart{height:130px;display:flex;gap:12px;align-items:end;padding-top:18px;border-bottom:1px solid #d7d4e6}.ledger-chart i{flex:1;background:#ddd7f6;border-radius:3px 3px 0 0}.ledger-chart i:nth-child(3n){background:#8c7bce}.ledger-chart i:last-child{background:#5945b2}.ledger-row{display:grid;grid-template-columns:1fr 100px 90px;gap:12px;padding:16px 0;border-bottom:1px solid #eeedf3;font-size:11px}.margin-notes{padding:45px 48px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.margin-notes h3{font-size:21px;margin-bottom:15px}.margin-notes p{font-size:12px;line-height:1.8}.margin .colophon{background:#dedbea}
/* Close-up product studies create the reference's mixed horizontal/portrait rhythm. */
.ledger-detail{min-height:820px;background:#dedbea;padding:70px 65px}.ledger-detail .eyebrow{color:#665b89}.ledger-detail h2{font:64px Cormorant;margin-top:16px}.detail-panel{margin-top:38px;background:#fff;border:7px solid #f8f8fc;border-radius:27px;box-shadow:0 18px 0 #b9b1d719,0 30px 55px #524b7714;padding:30px;transform:rotate(-2deg)}.detail-panel .ledger-chart{height:160px}.detail-balance{display:flex;justify-content:space-between;align-items:end}.detail-balance strong{font-size:53px;letter-spacing:-.06em}.detail-note{display:flex;justify-content:space-between;margin-top:24px;font-size:12px;color:#5b576c}.play-detail{min-height:800px;background:#d2ddca;padding:60px;color:#293b30}.play-detail>h2{font:64px Cormorant;max-width:590px}.player{height:420px;position:relative;margin-top:35px;border:7px solid #f7f8f2;border-radius:28px;background:#1b2420;color:#e4eadf;padding:35px;overflow:hidden;box-shadow:0 8px 0 #aebca62b,0 26px 40px #37452f20;transform:rotate(1.5deg)}.player .record{width:315px;height:315px;top:45px;right:28px}.player h3{font:56px/1 Cormorant;max-width:360px;margin-top:25px}.player .record:after{font-size:9px}.player-controls{display:flex;gap:26px;align-items:center;margin-top:38px;font-size:24px}.player-controls b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#d5e8c0;color:#203126;font-size:19px}.progress{height:2px;background:#aab6a744;width:330px;margin-top:24px}.progress:before{content:'';display:block;width:45%;height:2px;background:#d5e8c0}.play-detail .colophon{padding:30px 0}
</style><body>
<script>
const art=(id,cls,html)=>{const e=document.createElement('section');e.dataset.artboard=id;e.className='artboard '+cls;e.innerHTML=html;document.body.append(e)};
const nav=(brand,links,cta)=>`<nav class="nav"><span class="brand">${brand}</span><span>${links}</span><span class="pill outline">${cta} ↗</span></nav>`;
const colophon=(type)=>`<div class="colophon"><span>BHOOMIKA.S / ${type}</span><span>Fictional concept · sample content</span></div>`;
const bars=()=>[38,52,47,68,59,82,70,62,78,95,84,100].map(h=>`<i style="height:${h}%"></i>`).join('');
art('stillwater','stillwater',nav('STILLWATER','The house &nbsp; &nbsp; Rooms &nbsp; &nbsp; Around here','Plan a stay')+`<div class="stay-hero"><img src="/design/playground/photos/coast.jpg" alt=""><div class="stay-title"><small>A small house. A long view.</small><h1 class="mt">Stay for<br>the stillness.</h1><div class="flex mt"><p class="fine">Slow mornings by the water.<br>A room you’ll be happy to come back to.</p><span class="fine">A lakeside stay, imagined.</span></div></div></div><div class="stay-booking"><div><small>Arrive</small><b>Choose a day</b></div><div><small>Leave</small><b>When you’re ready</b></div><div><small>Guests</small><b>Two, for now</b></div><span class="pill">Find a room ↗</span></div><section class="stay-note grid"><h2>Nothing on the list.<br>Everything you need.</h2><p>Open the shutters. Take your coffee outside. Ask us for the walking map, or leave it on the table. There is time for a swim before dinner, and no need to decide yet.</p></section><section class="stay-rooms"><div class="stay-room"><small>01 / Towards the water</small><h3 class="mt">The lake room</h3><p class="fine mt">Morning light, linen sheets, a place to read.</p></div><div class="stay-room"><small>02 / A little more space</small><h3 class="mt">The garden room</h3><p class="fine mt">Doors onto the terrace. Bring a second book.</p></div></section>`+colophon('Hospitality landing page'));
art('nocturne','nocturne',nav('nocturne','The room &nbsp; &nbsp; Listening notes &nbsp; &nbsp; Tonight','Find a seat')+`<section class="listen-hero"><small>Records. A drink. A little less noise.</small><h1 class="mt">For the<br>whole<br>record.</h1><div class="record"><i class="record-pin"></i></div><p class="mt">A listening room for the tracks you skip past and the albums you know by heart.</p><div class="mt"><span class="pill">See what’s playing ↗</span></div><div class="listen-caption"><span>NO SHUFFLE. NO RUSH.</span><span>SIDE A / THEN SIDE B</span></div></section><section class="set-list"><div class="flex"><h2>On the turntable.</h2><small>An imagined listening programme</small></div>${[['18:00','The slow opening','Warm keys. An unhurried start.'],['20:00','A room full of rhythm','Soul, broken beat, and a few surprises.'],['22:00','One for the walk home','The softer end of the evening.']].map(([time,title,note])=>`<div class="set-row"><span class="fine">${time}</span><div><h3>${title}</h3><p>${note}</p></div><span class="fine">House selection ↗</span></div>`).join('')}</section><section class="room-note"><h2>Pull up a chair.<br>Let the side finish.</h2><p>Come on your own or bring someone who will listen with you. There are no requests during a side, but there’s always a conversation afterwards.</p></section>`+colophon('Music & hospitality'));
art('forme-light','forme',nav('FORME','Lighting &nbsp; &nbsp; Materials &nbsp; &nbsp; Journal','View the collection')+`<section class="forme-title"><small>Objects that change the room.</small><div class="flex mt"><h1>A softer<br>point of view.</h1><p class="fine" style="max-width:230px">Light for the table, the late page,<br>and the corner you keep coming back to.</p></div></section><div class="forme-photo"><img src="/design/playground/photos/lighting.jpg" alt=""><div class="forme-label"><small>Light study / 01</small><h3>The quiet glow.</h3></div></div><section class="material-list"><div class="grid"><h2>Considered from<br>every angle.</h2><div><p class="fine">A warm finish. A clear outline. The right amount of light, exactly where it belongs. A catalogue study about material, proportion and the things we live with.</p><div class="mt"><i class="finish"></i><i class="finish"></i><i class="finish"></i><span class="fine" style="margin-left:16px">Material palette</span></div></div></div><div class="forme-meta"><div><small>01 / At the table</small><b>A pool of warm light.</b></div><div><small>02 / Beside the bed</small><b>Just one more chapter.</b></div><div><small>03 / In the room</small><b>Quietly, a different mood.</b></div></div></section>`+colophon('Lighting catalogue concept'));
art('margin-finance','margin',nav('margin.','The workspace &nbsp; &nbsp; How it works &nbsp; &nbsp; Help','Try the workspace')+`<section class="margin-hero"><small>A clearer desk for independent work.</small><h1 class="mt">Keep the numbers<br>off your mind.</h1><div class="flex mt"><p>See what’s been paid, what’s still due, and what needs a nudge. Then close the tab and get on with your work.</p><span class="pill">Explore the demo ↗</span></div></section><section class="ledger"><div class="ledger-top flex"><strong>margin. / Your workspace</strong><span>Illustrative data only · October</span></div><div class="ledger-main"><aside class="ledger-aside"><p style="color:#6651ca">◧ Overview</p><p>▤ Invoices</p><p>◷ Activity</p><p>↗ Reports</p><p style="margin-top:100px">Workspace settings</p></aside><div class="ledger-content"><div class="ledger-figures"><div><small>Paid this month</small><strong>₹84,500<span style="font-size:15px">.00</span></strong></div><div><small>Waiting on payment</small><strong>₹21,000<span style="font-size:15px">.00</span></strong></div></div><div class="ledger-chart">${bars()}</div><div class="flex fine mt"><span>Recent invoices</span><span>View all ↗</span></div><div class="ledger-row"><span>Website design / INV–014</span><span>₹18,000</span><span>Paid</span></div><div class="ledger-row"><span>Illustration / INV–015</span><span>₹12,500</span><span>Paid</span></div><div class="ledger-row"><span>Product review / INV–016</span><span>₹21,000</span><span>Due Friday</span></div></div></div></section><section class="margin-notes"><div><h3>Send it once.</h3><p>Keep the invoice and its history in the same place.</p></div><div><h3>Know what’s due.</h3><p>A short list of the things that need your attention.</p></div><div><h3>End the month.</h3><p>Leave the spreadsheet archaeology for another time.</p></div></section>`+colophon('Financial workspace design / not a live service'));
art('margin-ledger','ledger-detail',`<small class="eyebrow">MARGIN / A CLOSER LOOK</small><h2>A month, at a glance.</h2><div class="detail-panel"><div class="detail-balance"><div><small>Paid this month</small><strong style="display:block">₹84,500<span style="font-size:24px">.00</span></strong></div><span class="pill" style="background:#efedf8;color:#625392">October ↓</span></div><div class="ledger-chart">${bars()}</div><div class="detail-note"><span>01 Oct</span><span>15 Oct</span><span>31 Oct</span></div><div class="ledger-row mt"><span>Invoices paid</span><span>06</span><span>View all ↗</span></div><div class="ledger-row"><span>Next payment due</span><span>Friday</span><span>₹21,000</span></div></div><p class="fine" style="margin-top:30px;color:#665b89">Original interface study · Sample figures, not financial results.</p>`);
art('nocturne-player','play-detail',`<small>NOCTURNE / THE LISTENING DESK</small><h2 class="mt">Leave a little room<br>for the next track.</h2><div class="player"><small>THE HOUSE SELECTION / SIDE A</small><h3>After the<br>last train.</h3><p class="fine mt" style="color:#aab9aa">An imagined late-night mix.</p><div class="player-controls"><span>‹</span><b>Ⅱ</b><span>›</span></div><div class="progress"></div><div class="flex fine" style="width:330px;margin-top:8px"><span>08:14</span><span>32:00</span></div><div class="record"><i class="record-pin"></i></div></div>`+colophon('Original music-player interface'));
</script></body></html>
